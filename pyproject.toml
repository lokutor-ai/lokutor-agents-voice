[project]
name = "lokutor-agents-voice"
version = "0.1.0"
description = "Lokutor speech-to-text and text-to-speech for the OpenAI Agents SDK voice pipeline"
requires-python = ">=3.10"
dependencies = ["openai-agents[voice]>=0.2", "httpx", "numpy"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/lokutor_agents_voice"]
